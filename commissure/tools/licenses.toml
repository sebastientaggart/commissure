# License decisions for Commissure (read by commissure/tools/licenses.py).
#
# Holds only what metadata cannot say: the allowlist, overrides, exceptions, and vendored-file
# provenance. Versions and licenses of Python packages come from installed metadata; run
# `commissure licenses` for the inventory. tests/test_licenses.py enforces this file.

# Reviewers approve these without review. Adding an id is a policy decision.
allowed = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MIT-0",
    "MIT-CMU",
    "PSF-2.0",
]

# Commissure's own files in commissure/deliver/static/ (MIT, with the package). Every other
# file there must be a [[vendored]] entry below, so a new file cannot arrive without a license
# decision. logo.svg's wordmark is Inter Medium outlined to paths (OFL-1.1 permits this; no font
# file is embedded). Top-level keys must precede the tables below (TOML).
first_party = ["favicon.svg", "logo.svg", "report.css", "report.js"]

# --- Overrides -------------------------------------------------------------------------------
# For packages whose metadata names no SPDX license. `declared` is the string the metadata
# reports today; when it changes the override stops applying and the gate fails, so a relicense
# cannot hide behind a stale override.

[packages.jinja2]
declared = "BSD License"
license = "BSD-3-Clause"
note = "Legacy classifier; jinja2-*.dist-info/licenses/LICENSE.txt is BSD-3-Clause."

[packages.pypdfium2]
declared = "BSD-3-Clause, Apache-2.0, dependency licenses"
license = "Apache-2.0 OR BSD-3-Clause"
note = """Bindings are dual-licensed. The bundled PDFium binary and its components \
(BUILD_LICENSES/ in the wheel) are permissive: BSD-3-Clause, Apache-2.0, MIT, FTL, \
Unicode-3.0, IJG, Libpng, Zlib. LICENSES/CC-BY-4.0.txt covers documentation only."""

# --- Exceptions ------------------------------------------------------------------------------
# Operator-approved departures from the allowlist. `scope` is "core" or "extra:<name>". An
# exception with `component` records non-permissive code bundled inside a package whose own
# metadata is permissive; metadata cannot see it, so it is reviewed by hand on upgrade.

[[exception]]
package = "docxtpl"
license = "LGPL-2.1-only"
scope = "extra:docx"
decided = "2026-10-25"
reason = """Kept out of core so `pip install commissure` stays permissive; core never imports \
it (tests/test_licenses.py). Recipes opt in for .docx templates with conditionals and block \
loops, which no permissive library offers (docx-mailmerge, MIT, has merge fields and row \
repetition only). Using the unmodified library imposes nothing on Commissure or recipe source; \
shipping it inside a closed binary or appliance would require LGPL compliance for docxtpl."""

[[exception]]
package = "lxml"
component = "GNU libiconv, statically linked into PyPI binary wheels"
license = "LGPL-2.1"
scope = "core"
decided = "2026-10-25"
reason = """Pulled in by python-docx. Running from source or a uv environment triggers no \
obligation. Redistributing prebuilt wheels inside a closed executable, appliance, or container \
image would; then build lxml from source against OS libraries \
(`uv sync --no-binary-package lxml`). The wheel's two unlicensed isoschematron XSL files are \
never imported (only lxml.etree is used)."""

