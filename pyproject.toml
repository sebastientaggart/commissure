[project]
name = "commissure"
version = "0.2.0"
description = "Local substrate for coding agents working on messy client data and document operations."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sebastien Taggart" }]
requires-python = ">=3.12"
keywords = [
    "cli",
    "data-pipeline",
    "document-processing",
    "local-first",
    "pdf",
    "pydantic",
    "sqlite",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Text Processing",
    "Typing :: Typed",
]
dependencies = [
    "jinja2>=3.1.6",
    "openpyxl>=3.1.5",
    "packaging>=26.3",
    "pdfplumber>=0.11.10",
    "pydantic>=2.14.1",
    "pydantic-ai-slim[anthropic,openrouter]>=2.61.0",
    "pypdfium2>=5.14.0",
    "pytesseract>=0.3.13",
    "python-docx>=1.2.0",
    "rapidfuzz>=3.14.6",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.urls]
Homepage = "https://www.sebastientaggart.com/projects/commisure/"
Repository = "https://github.com/sebastientaggart/commissure/"
Issues = "https://github.com/sebastientaggart/commissure/issues"

[project.optional-dependencies]
docx = [
    "docxtpl>=0.20.2",
]

[project.scripts]
commissure = "commissure.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.2",
]

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "commissure"
module-root = ""
source-exclude = ["**/.DS_Store"]
wheel-exclude = ["**/.DS_Store"]

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "solutions",
]
norecursedirs = [
    "workspace",
    "intake",
    "docs",
    "recipe",
    "releases",
    "build",
    "dist",
    ".*",
]
# Parallel by default (pytest-xdist, dev group): agents run the full suite often.
# Debug one test with -n0 so print output and pdb work.
addopts = "-ra --strict-markers -n auto"

[tool.ruff]
line-length = 100
target-version = "py312"
# Markdown is prose (reference documents keep aligned comments in fenced code); ruff formats Python.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
