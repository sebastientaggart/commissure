name: CI

# Prose only: no test or lint reads these. A push touching anything else still runs CI.
# Markdown inside commissure/ (scaffold template, vendored licenses) ships and is tested.
on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - ".agents/**"
      - "docs/**/*.md"
      - "docs/**/*.svg"
  pull_request:
    paths-ignore:
      - "*.md"
      - ".agents/**"
      - "docs/**/*.md"
      - "docs/**/*.svg"

# A newer push to the same branch or PR makes the running check moot.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # A normal run is ~5 min; the default 6 h limit would let a hung test burn the quota.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install Tesseract OCR
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Sync environment
        run: uv sync --all-extras

      - name: Lint and format check
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Check third-party licenses
        run: uv run commissure licenses

      - name: Run test suite
        run: uv run pytest tests
