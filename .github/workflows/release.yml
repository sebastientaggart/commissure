name: Release

# A tag v<version> on main publishes that version to PyPI (AGENTS.md Section 4). Trusted
# publishing: PyPI accepts this workflow's OIDC token, so no API token is stored anywhere.
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Install Tesseract OCR
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      # A tag that disagrees with pyproject.toml would publish a version nobody asked for.
      - name: Tag matches the package version
        run: |
          version=$(uv version --short)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, package $version"; exit 1; }

      - name: Test
        run: |
          uv sync --all-extras
          uv run ruff check .
          uv run ruff format --check .
          uv run commissure licenses
          uv run pytest tests -n0
        env:
          COMMISSURE_SCAFFOLD_INTEGRATION: "1"

      - name: Build
        run: uv build

      - name: Attest
        uses: astral-sh/attest-action@v0

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always
