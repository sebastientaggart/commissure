<svg xmlns="http://www.w3.org/2000/svg" width="88" height="20" viewBox="0 0 88 20" role="img" aria-label="uv: managed">
  <title>uv: managed</title>
  <style>
    :root { --l:#24292f; --r:#2b8a3e; }
    @media (prefers-color-scheme: dark) { :root { --l:#30363d; --r:#2b8a3e; } }
  </style>
  <linearGradient id="s" x2="0" y2="100%">
    <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
    <stop offset="1" stop-opacity=".1"/>
  </linearGradient>
  <clipPath id="c">
    <rect width="88" height="20" rx="3" fill="#fff"/>
  </clipPath>
  <g clip-path="url(#c)">
    <rect width="25" height="20" fill="var(--l)"/>
    <rect x="25" width="63" height="20" fill="var(--r)"/>
    <rect width="88" height="20" fill="url(#s)"/>
  </g>
  <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="110">
    <text aria-hidden="true" x="130" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="135">uv</text>
    <text x="130" y="140" transform="scale(.1)" fill="#fff" textLength="135">uv</text>
    <text aria-hidden="true" x="560" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="511">managed</text>
    <text x="560" y="140" transform="scale(.1)" fill="#fff" textLength="511">managed</text>
  </g>
</svg>
