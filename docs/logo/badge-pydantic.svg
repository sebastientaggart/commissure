<svg xmlns="http://www.w3.org/2000/svg" width="85" height="20" viewBox="0 0 85 20" role="img" aria-label="pydantic: v2">
  <title>pydantic: v2</title>
  <style>
    :root { --l:#24292f; --r:#d61f5a; }
    @media (prefers-color-scheme: dark) { :root { --l:#30363d; --r:#d61f5a; } }
  </style>
  <linearGradient id="s" x2="0" y2="100%">
    <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
    <stop offset="1" stop-opacity=".1"/>
  </linearGradient>
  <clipPath id="c">
    <rect width="85" height="20" rx="3" fill="#fff"/>
