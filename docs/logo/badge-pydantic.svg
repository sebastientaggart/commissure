    <rect x="59" width="26" height="20" fill="var(--r)"/>
    <rect width="85" height="20" fill="url(#s)"/>
  </g>
  <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="110">
    <text aria-hidden="true" x="300" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="469">pydantic</text>
    <text x="300" y="140" transform="scale(.1)" fill="#fff" textLength="469">pydantic</text>
    <text aria-hidden="true" x="715" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="135">v2</text>
    <text x="715" y="140" transform="scale(.1)" fill="#fff" textLength="135">v2</text>
  </g>
</svg>
