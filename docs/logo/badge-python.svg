<svg xmlns="http://www.w3.org/2000/svg" width="96" height="20" viewBox="0 0 96 20" role="img" aria-label="python: 3.12+">
  <title>python: 3.12+</title>
  <style>
    :root { --l:#24292f; --r:#3776ab; }
    @media (prefers-color-scheme: dark) { :root { --l:#30363d; --r:#3776ab; } }
  </style>
  <linearGradient id="s" x2="0" y2="100%">
    <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
    <stop offset="1" stop-opacity=".1"/>
  </linearGradient>
  <clipPath id="c">
    <rect width="96" height="20" rx="3" fill="#fff"/>
