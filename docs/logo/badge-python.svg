  </g>
  <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="110">
    <text aria-hidden="true" x="255" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="383">python</text>
    <text x="255" y="140" transform="scale(.1)" fill="#fff" textLength="383">python</text>
    <text aria-hidden="true" x="725" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="340">3.12+</text>
    <text x="725" y="140" transform="scale(.1)" fill="#fff" textLength="340">3.12+</text>
  </g>
