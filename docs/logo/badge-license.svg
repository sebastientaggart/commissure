<svg xmlns="http://www.w3.org/2000/svg" width="83" height="20" viewBox="0 0 83 20" role="img" aria-label="license: MIT">
  <title>license: MIT</title>
  <style>
    :root { --l:#24292f; --r:#d9480f; }
    @media (prefers-color-scheme: dark) { :root { --l:#30363d; --r:#d9480f; } }
  </style>
  <linearGradient id="s" x2="0" y2="100%">
    <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
    <stop offset="1" stop-opacity=".1"/>
  </linearGradient>
  <clipPath id="c">
    <rect width="83" height="20" rx="3" fill="#fff"/>
  </clipPath>
  <g clip-path="url(#c)">
    <rect width="50" height="20" fill="var(--l)"/>
    <rect x="50" width="33" height="20" fill="var(--r)"/>
    <rect width="83" height="20" fill="url(#s)"/>
  </g>
  <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="110">
    <text aria-hidden="true" x="255" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="376">license</text>
    <text x="255" y="140" transform="scale(.1)" fill="#fff" textLength="376">license</text>
    <text aria-hidden="true" x="660" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="207">MIT</text>
    <text x="660" y="140" transform="scale(.1)" fill="#fff" textLength="207">MIT</text>
  </g>
</svg>
